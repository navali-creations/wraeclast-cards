name: Publish drop-rate data

on:
  schedule:
    # GitHub schedules can be delayed at the top of the hour; use a non-zero minute.
    - cron: "17 23 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      backfill_historical:
        description: "Fetch inactive leagues that are missing from the current static manifest"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Generate drop-rate JSON
        run: pnpm drop-rates:generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WRAECLAST_CARDS_API_KEY: ${{ secrets.WRAECLAST_CARDS_API_KEY }}
          DROP_RATES_PUBLIC_BASE_URL: https://wraeclast-cards.pages.dev/data/drop-rates
          DROP_RATES_REFERENCE_DATA_BASE_URL: https://raw.githubusercontent.com/navali-creations/fateweaver/main/packages/poe1-divination-cards/data
          DROP_RATES_BACKFILL_HISTORICAL: ${{ github.event.inputs.backfill_historical || 'false' }}

      - name: Generate sitemap
        run: pnpm sitemap:generate
        env:
          SITE_URL: https://wraeclast.cards

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4.100.0 pages deploy dist --project-name wraeclast-cards
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
