name: Publish drop-rate data

on:
  schedule:
    # GitHub schedules can be delayed at the top of the hour; use a non-zero minute.
    - cron: "17 23 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      backfill_historical:
        description: "Fetch inactive leagues that are missing from the current static manifest"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate publishing secrets
        run: |
          missing=0
          for name in \
            SUPABASE_URL \
            WRAECLAST_CARDS_API_KEY \
            WRAECLAST_CARDS_CALLER_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name repository secret"
              missing=1
            fi
          done
          exit "$missing"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WRAECLAST_CARDS_API_KEY: ${{ secrets.WRAECLAST_CARDS_API_KEY }}
          WRAECLAST_CARDS_CALLER_TOKEN: ${{ secrets.WRAECLAST_CARDS_CALLER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Generate drop-rate JSON
        run: pnpm drop-rates:generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WRAECLAST_CARDS_API_KEY: ${{ secrets.WRAECLAST_CARDS_API_KEY }}
          WRAECLAST_CARDS_CALLER_TOKEN: ${{ secrets.WRAECLAST_CARDS_CALLER_TOKEN }}
          DROP_RATES_PUBLIC_BASE_URL: https://wraeclast-cards.pages.dev/data/drop-rates
          DROP_RATES_REFERENCE_DATA_BASE_URL: https://cdn.jsdelivr.net/gh/navali-creations/fateweaver@main/packages/poe1-divination-cards/data
          DROP_RATES_BACKFILL_HISTORICAL: ${{ github.event.inputs.backfill_historical || 'false' }}

      - name: Generate sitemap
        run: pnpm sitemap:generate
        env:
          SITE_URL: https://wraeclast.cards

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4.100.0 pages deploy dist --project-name wraeclast-cards
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Submit sitemap to Google Search Console
        run: pnpm sitemap:submit:google
        env:
          GOOGLE_SEARCH_CONSOLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_EMAIL }}
          GOOGLE_SEARCH_CONSOLE_PRIVATE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PRIVATE_KEY }}
          GOOGLE_SEARCH_CONSOLE_FAIL_ON_ERROR: "false"
          GOOGLE_SEARCH_CONSOLE_SKIP_SITEMAP_CHECK: "true"
          GOOGLE_SEARCH_CONSOLE_SITE_URL: sc-domain:wraeclast.cards
          GOOGLE_SEARCH_CONSOLE_SITEMAP_URL: https://wraeclast.cards/sitemap.xml
