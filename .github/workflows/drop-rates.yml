name: Publish drop-rate data

on:
  schedule:
    # GitHub cron is UTC. These two slots cover 23:00 Europe/Warsaw across DST.
    - cron: "0 21,22 * * *"
  workflow_dispatch:
    inputs:
      backfill_historical:
        description: "Fetch inactive leagues that are missing from the current static manifest"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check scheduled local time
        id: schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(TZ=Europe/Warsaw date +%H)" = "23" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.schedule.outputs.run == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.schedule.outputs.run == 'true'
        with:
          version: 11.3.0

      - uses: actions/setup-node@v6
        if: steps.schedule.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build site
        if: steps.schedule.outputs.run == 'true'
        run: pnpm build

      - name: Generate drop-rate JSON
        if: steps.schedule.outputs.run == 'true'
        run: pnpm drop-rates:generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WRAECLAST_CARDS_API_KEY: ${{ secrets.WRAECLAST_CARDS_API_KEY }}
          DROP_RATES_PUBLIC_BASE_URL: https://wraeclast.cards/data/drop-rates
          DROP_RATES_RESEARCH_DATA_BASE_URL: https://raw.githubusercontent.com/navali-creations/fateweaver/main/packages/poe1-divination-cards/data
          DROP_RATES_BACKFILL_HISTORICAL: ${{ github.event.inputs.backfill_historical || 'false' }}

      - name: Deploy to Cloudflare Pages
        if: steps.schedule.outputs.run == 'true'
        run: pnpm dlx wrangler@4.100.0 pages deploy dist --project-name wraeclast-cards
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
